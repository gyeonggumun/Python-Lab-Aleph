{% extends 'index.html' %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white text-center">
                    <h4>☕ 카페이야기 로그인</h4>
                </div>
                <div class="card-body p-4">
                    <!-- 알림 메시지 출력 영역 -->
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ category }}">{{ message }}</div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                    <form method="POST" action="{{ url_for('auth.login') }}">
                        <div class="form-group">
                            <label for="username">아이디</label>
                            <input type="text" class="form-control" id="username" name="username" placeholder="아이디를 입력하세요" required>
                        </div>
                        <div class="form-group mt-3">
                            <label for="password">비밀번호</label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="비밀번호를 입력하세요" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block mt-4 w-100">로그인</button>
                    </form>
                    <div class="text-center mt-3">
                        <a href="{{ url_for('auth.register') }}" class="text-muted">아직 회원이 아니신가요? 회원가입</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
